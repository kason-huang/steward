id: libero-panda
display: LIBERO Franka Panda
mechanical:
  base: fixed
  arms:
    - {id: arm, model: OnTheGroundPanda, dof: 7}
  grippers:
    - {arm: arm, type: parallel-2f, control: physical-position}
  grasp:
    sim: contact
sensors:
  cameras:
    - {id: external, kind: rgbd, model_camera: overview, fixed: true}
    - {id: wrist, kind: rgbd, model_camera: robot0_eye_in_hand}
  proprioception: [arm position, arm velocity, finger position, finger velocity, tool pose]
self_model:
  kinematics: {format: mjcf, site: gripper0_grip_site}
  actuator: {arm: torque, fingers: position}
control_face:
  mode: OSC_POSE
  rates_hz: {goal: 20, physics: 500}
  port: /control
execution_stack:
  ego_runtime: steward.ego.panda_runtime.PandaEgoRuntime
  policy_skill: libero_pick_place
  controller: steward.world.panda_osc.PandaOsc
sim2real:
  real_backend: none
tasks:
  sim: libero-object-alphabet-soup-panda
